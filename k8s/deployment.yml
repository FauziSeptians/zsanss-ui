apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook-app
  labels:
    app: storybook-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: storybook-app
  template:
    metadata:
      labels:
        app: storybook-app
    spec:
      containers:
        - name: storybook-app
          image: DOCKER_USERNAME/storybook-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '200m'
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: storybook-app-service
  labels:
    app: storybook-app
spec:
  type: NodePort
  selector:
    app: storybook-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30600